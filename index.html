    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="7" y="13" width="3" height="3" rx=".6" fill="currentColor"/></symbol>

  <div id="ptr" aria-hidden="true"><svg><use href="#i-refresh"/></svg></div>

  <header class="topbar">
    <button id="title" class="title-btn" aria-haspopup="listbox"><span id="title-text">Granollers Live</span><svg class="chev"><use href="#i-chev"/></svg></button>
    <div class="topbar-actions">
      <button id="btn-share" class="icon-btn" aria-label="Comparteix" title="Comparteix el resultat"><svg><use href="#i-share"/></svg></button>
      <button id="btn-refresh" class="icon-btn" aria-label="Actualitza"><svg><use href="#i-refresh"/></svg></button>
    </div>
  </header>

  <main id="view"></main>

  <footer class="foot" id="foot">Feta per <strong>carlos.c</strong> per a les grades del CB Granollers · 2026<br>Dades: acta digital FCBQ · ús personal · no oficial</footer>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg"></div>
    <div class="sheet-panel" role="listbox" aria-label="Equips">
      <div class="sheet-handle"></div>
      <div class="card-head">Els teus equips</div>
      <ul id="sheet-list"></ul>
      <button id="sheet-add" class="btn ghost-ink">+ Afegeix un equip</button>
    </div>
  </div>

  <nav class="bottom-nav" id="nav">
    <button data-screen="match"><svg><use href="#i-ball"/></svg><span>Partit</span></button>
    <button data-screen="home"><svg><use href="#i-cal"/></svg><span>Calendari</span></button>
    <button data-screen="standings"><svg><use href="#i-table"/></svg><span>Classificació</span></button>
    <button data-screen="setup"><svg><use href="#i-gear"/></svg><span>Ajustos</span></button>
  </nav>

  <script src="config.local.js" onerror="window.FCBQ_CONFIG = window.FCBQ_CONFIG || {}"></script>
  <script type="module" src="app.js?v=21"></script>
</body>
</html>
